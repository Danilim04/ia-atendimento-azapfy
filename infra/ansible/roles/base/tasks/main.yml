---
# ==============================================================================
# Role base — estado da VM do bot, idempotente: usuário deploy, hardening ssh,
# firewall, updates automáticos, swap e Docker. Espelha a role base do
# omni-route (a VM é compartilhada com a stack de lá — convergir o mesmo estado
# é proposital); o que é específico do bot é o app_dir.
# ==============================================================================

# --- Usuário de deploy --------------------------------------------------------
- name: Usuário {{ deploy_user }}
  ansible.builtin.user:
    name: '{{ deploy_user }}'
    shell: /bin/bash
    groups: sudo
    append: true

- name: Sudo sem senha para {{ deploy_user }}
  ansible.builtin.copy:
    dest: /etc/sudoers.d/90-azapfy-deploy
    content: '{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL'
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Chave SSH autorizada do {{ deploy_user }}
  ansible.posix.authorized_key:
    user: '{{ deploy_user }}'
    key: '{{ deploy_ssh_public_key }}'
  when: deploy_ssh_public_key is defined

# Diretório da stack — o deploy (pipeline) sincroniza os arquivos pra cá.
- name: Garante {{ app_dir }} (dono {{ deploy_user }})
  ansible.builtin.file:
    path: '{{ app_dir }}'
    state: directory
    owner: '{{ deploy_user }}'
    group: '{{ deploy_user }}'
    mode: '0755'

# --- Hardening sshd -----------------------------------------------------------
- name: sshd — sem autenticação por senha
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: reiniciar sshd

- name: sshd — root só com chave
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin prohibit-password'
  notify: reiniciar sshd

# --- Pacotes base -------------------------------------------------------------
- name: Pacotes base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ufw
      - unattended-upgrades
      - rsync
      - openssl
      - python3-debian # exigido pelo deb822_repository
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  when: enable_fail2ban

- name: fail2ban ativo
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: enable_fail2ban

- name: Atualizações automáticas de segurança
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: '0644'

# --- Firewall -----------------------------------------------------------------
# ATENÇÃO: Docker publica portas direto no iptables, BYPASSANDO o UFW. A
# proteção efetiva dos containers é (a) nenhuma porta publicada no compose de
# produção e (b) o firewall da Hetzner (Terraform). O UFW cobre o próprio host.
- name: UFW — libera SSH/HTTP/HTTPS
  community.general.ufw:
    rule: allow
    port: '{{ item }}'
    proto: tcp
  loop: ['22', '80', '443']

- name: UFW ligado (default deny incoming)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

# --- Swap (a VPS tem 4 GB e roda duas stacks) ---------------------------------
- name: Cria swapfile de {{ swap_size_mb }}MB
  ansible.builtin.shell: |
    set -euo pipefail
    fallocate -l {{ swap_size_mb }}M /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
    swapon /swapfile
  args:
    executable: /bin/bash
    creates: /swapfile

- name: Swap no fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'

# --- Docker CE + compose plugin (repo oficial; compose ≥ 2.24.4 p/ tags !reset)
- name: Repositório Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ['{{ ansible_facts["distribution_release"] }}']
    components: [stable]
    architectures: ["{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"]
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: Docker CE + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Docker ativo
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: '{{ deploy_user }} no grupo docker'
  ansible.builtin.user:
    name: '{{ deploy_user }}'
    groups: docker
    append: true

# O grupo docker só vale em conexão nova — força reconexão para tasks seguintes.
- name: Reconecta para aplicar o grupo docker
  ansible.builtin.meta: reset_connection
